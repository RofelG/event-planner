name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks out code and runs tests.
permissions:
  contents: read

# Cancel an older run when a newer commit lands on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # server/config.js appends "_test" to DB_DB when NODE_ENV=test.
          MYSQL_DATABASE: event_planner_test
          MYSQL_USER: event_planner
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Throwaway credentials for the disposable CI database only.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: event_planner
      DB_PASS: ci-password
      DB_DB: event_planner

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A fresh random signing key per run, so no secret needs to be stored.
      - name: Generate JWT signing key
        run: echo "TOKEN_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # The tests reset and seed this database, so it must be disposable.
          MYSQL_DATABASE: event_planner_e2e
          MYSQL_USER: event_planner
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Throwaway credentials for the disposable CI database and demo accounts.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: event_planner
      DB_PASS: ci-password
      DB_DB: event_planner_e2e
      SEED_ADMIN_EMAIL: admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_PLANNER_EMAIL: planner@example.test
      SEED_PLANNER_PASSWORD: ci-planner-password
      SEED_USER_EMAIL: member@example.test
      SEED_USER_PASSWORD: ci-member-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A fresh random signing key per run, so no secret needs to be stored.
      - name: Generate JWT signing key
        run: echo "TOKEN_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
