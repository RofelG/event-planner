# Production stack: Caddy (HTTPS) -> app (Express + built client) -> MySQL.
# Run with: docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy publishes ports; the app and database are reachable on the
# internal network only.
services:
  app:
    build: .
    image: event-planner:latest
    # On the server, .env holds the production settings (copied from
    # .env.production.example). Compose also reads .env to fill in the
    # ${...} values below, so no --env-file flag is ever needed.
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name,
      # whatever DB_HOST says in the env file.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Live updates keep open streams in this process's memory: do not scale
    # this service beyond one container.

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_DB:?Set DB_DB in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      # The app creates and updates the schema itself on start (migrations).
      - db_data:/var/lib/mysql
    healthcheck:
      # $$ defers expansion to the container shell so the password is not
      # written into the rendered compose config.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
